seed: 7
device: cuda

data:
  num_samples: 20000
  min_rings: 2
  max_rings: 8
  peri_probability: 0.20
  templates: [benzene, pyridine, pyrazine, pyrrole, furan, thiophene, borinine]

diffusion:
  timesteps: 200
  beta_start: 0.0001
  beta_end: 0.02

model:
  hidden_dim: 192
  num_layers: 6
  time_dim: 64
  max_ports: 8

training:
  batch_size: 32
  epochs: 50
  learning_rate: 0.0002
  weight_decay: 0.000001
  grad_clip: 1.0
  center_weight: 1.0
  normal_weight: 0.25
  ring_type_weight: 1.0
  connection_weight: 1.0
  port_weight: 0.5
  checkpoint: runs/polyring.pt

sampling:
  num_rings: 6
  num_samples: 16
  max_extra_fusions: 2
  output: samples/generated.jsonl

