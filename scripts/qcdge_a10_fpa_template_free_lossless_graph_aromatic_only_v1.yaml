seed: 61
device: cuda:0
data:
  root: data_qcdge_a10_full
  condition_mode: s1_t1
  frame_augmentation: true
  sidecar_dir: hydrogen_counts_v4_aromatic
  aromatic_only: true
diffusion:
  timesteps: 500
  beta_start: 0.0001
  beta_end: 0.02
  rotation_sigma_max: 3.0
  so3_grid: 512
  so3_terms: 128
model:
  hidden_dim: 256
  num_layers: 8
  time_dim: 64
  condition_dim: 2
  condition_rbf_kernels: 10
  condition_rbf_min: -4.0
  condition_rbf_max: 4.0
  condition_film: true
  chirality_enabled: false
  condition_dropout: 0.2
  min_ring_size: 3
  max_ring_size: 10
training:
  batch_size: 17000
  num_workers: 0
  epochs: 10000
  learning_rate: 0.0001
  weight_decay: 0.000001
  grad_clip: 1.0
  bf16: true
  balance_heavy_atom_count: true
  chemistry:
    bond_class_weights: [0.05, 1.0, 1.5, 2.0, 1.25]
    bond_focal_gamma: 2.0
    discrete_timestep_boost: 1.0
    radical_projection_threshold: 0.8
    aromatic_positive_weight: 9.0
  validation_batches: 10
  checkpoint_evaluation:
    enabled: true
    interval: 100
    samples: 16
    guidance: 1.0
    closed_shell: false
  output_dir: runs/qcdge_a10_fpa_template_free_lossless_graph_aromatic_only_v1
  loss_weights:
    atom_eps: 1.0
    cell_eps: 1.0
    radius_eps: 0.25
    rotation: 0.5
    atom_type: 1.0
    charge: 0.25
    hydrogen: 0.5
    radical: 0.25
    chirality: 0.0
    bond: 1.0
    cell_size: 0.5
    cell_aromatic: 0.25
    relation: 1.0
    membership: 1.0
    atom_count: 0.5
    cell_count: 0.5
    cell_geometry: 0.5
    cell_cardinality: 0.25
    relation_overlap: 0.5
    aromatic: 0.25
    bond_aromatic: 0.5
    aromatic_consistency: 1.0
    valence: 0.2
    valence_completion: 0.2
    charge_balance: 0.05
    radical_count: 0.05
    bond_length: 0.1
    connectivity: 0.05
    global_connectivity: 0.1
    aromatic_degree: 0.1
    radical_prior: 0.1
