    normal: 0.25
    ring: 1.0
    connection: 1.0
    port: 0.5
    property: 0.5
    valence: 0.5
    kekule: 0.5
    port_validity: 0.3
  validation_batches: 0
  early_stopping_patience: 100
  output_dir: runs/rigid_strong_condition
